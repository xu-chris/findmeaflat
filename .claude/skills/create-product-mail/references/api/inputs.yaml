schema_version: 1
inputs:
  - name: RESEND_API_KEY
    description: Resend API key for sending and receiving emails. Obtain it from https://resend.com/api-keys.
    required: true
    kind: environment-variable
    sensitive: true
  - name: RESEND_WEBHOOK_SECRET
    description: Webhook signing secret from the Resend dashboard for verifying event payloads.
    required: false
    kind: environment-variable
    sensitive: true
