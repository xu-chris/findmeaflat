name: CI

"on":
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_VERSION: v1
  POSTGRES_VERSION: 18

jobs:
  # Spelling runs as an independent, cheap check -- deliberately NOT a gate for
  # the other jobs, so a codespell false-positive on a German proper noun
  # (Mietspiegel, Hausverwaltung, Kleinanzeigen) cannot skip the real suite.
  spelling:
    name: Spell check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          ignore_words_file: .codespellignore
          path: docs

  # Detects which stack this repository currently is. The Elixir rewrite is a
  # proposal (docs/proposals/3-bet-go/001-elixir-multi-tenant-rewrite/), not code,
  # so today the Node job runs and the Elixir job skips. The day mix.exs lands at
  # the root, that flips with no workflow edit.
  detect-stack:
    name: Detect stack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      elixir: ${{ steps.detect.outputs.elixir }}
      node: ${{ steps.detect.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f mix.exs ]; then
            echo "elixir=true" >> "$GITHUB_OUTPUT"
          else
            echo "elixir=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No mix.exs - skipping the Elixir gate."
          fi
          # The Node crawler now lives in .references/ as read-only history and
          # is deliberately NOT gated: it is not maintained, and a red build on
          # archived code would train everyone to ignore CI.
          echo "node=false" >> "$GITHUB_OUTPUT"

  # The current Node crawler has no test suite and no lint script, so this is
  # deliberately modest: syntax and formatting only. Do not let it read as
  # "verified" -- it proves the files parse, nothing about whether crawling works.
  # Portal breakage is invisible to CI by design today; that is the problem the
  # rewrite's fixture tests exist to solve.
  node-checks:
    name: Node checks (syntax, format)
    needs: detect-stack
    if: needs.detect-stack.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check every source file
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::syntax error"; status=1; }
          done < <(find . -name '*.js' -not -path './node_modules/*')
          exit "$status"
        shell: bash

      - name: Prettier check
        run: npx --yes prettier --check "**/*.{js,json,md}" || true

  # The canonical Elixir gate. `mix ci` is the single alias the local pre-push
  # hook also invokes (.agents/hooks/install-git-hooks.sh), so a green push and a
  # green CI mean the same thing.
  elixir-checks:
    name: Static checks and tests
    needs: detect-stack
    if: needs.detect-stack.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: find_me_a_flat_test
        ports:
          # Host 5433 matches config/.env.test and the worktree setup hook.
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract versions from mix.exs
        id: versions
        run: |
          chmod +x .github/scripts/extract_versions.sh
          ./.github/scripts/extract_versions.sh

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: static-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ github.head_ref || github.ref }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            static-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ github.head_ref || github.ref }}-
            static-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-refs/heads/master-

      # Postgres is tuned before `mix ci` runs, since its final step creates and
      # migrates the database. Safe here because the container is ephemeral.
      - name: Configure PostgreSQL for fast tests
        run: |
          psql -h localhost -U postgres -c "ALTER SYSTEM SET fsync = 'off';"
          psql -h localhost -U postgres -c "ALTER SYSTEM SET synchronous_commit = 'off';"
          psql -h localhost -U postgres -c "ALTER SYSTEM SET full_page_writes = 'off';"
          psql -h localhost -U postgres -c "SELECT pg_reload_conf();"
        env:
          PGPASSWORD: postgres
          PGPORT: 5433

      # Canonical full gate. The local pre-push hook invokes this same alias.
      - run: mix ci
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

  # Opt-in, not automatic: label a PR `afk` and it runs on that PR's next push.
  #
  # `labeled` is deliberately NOT a trigger type: no other job here guards against
  # it, so adding any label would re-run everything. The label therefore takes
  # effect from the next push.
  #
  # Requires the `afk` label and the CLAUDE_CODE_OAUTH_TOKEN secret, NEITHER of
  # which exists in this repository yet -- see docs/agents/triage-labels.md for
  # the label. Until both exist this job simply never triggers.
  claude-review:
    name: Claude review
    # BOTH gates, not just the Node one: once mix.exs lands, elixir-checks
    # becomes the canonical gate and a review that ran without it would be
    # reviewing code no suite had exercised. `always()` lets the job run when a
    # lane is legitimately skipped, so the explicit result checks below are what
    # actually enforce "no gate failed".
    needs: [node-checks, elixir-checks]
    if: >-
      always() &&
      needs.node-checks.result != 'failure' &&
      needs.elixir-checks.result != 'failure' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'afk') &&
      (github.event.action == 'opened' ||
       github.event.action == 'synchronize' ||
       github.event.action == 'reopened' ||
       github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    timeout-minutes: 15

    steps:
      - name: Validate Claude token
        id: creds
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          if [ -n "$CLAUDE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_DEPENDABOT" = "true" ]; then
            # Dependabot runs read the Dependabot secrets store, not Actions
            # secrets. Warn rather than fail: a missing token there must not
            # turn every dependency PR red.
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Review skipped. Add CLAUDE_CODE_OAUTH_TOKEN to the Dependabot secrets store to review dependency PRs."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set - skipping review."
          fi

      - name: Checkout repository
        if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          # Full history: the reviewer's git tools need a base to diff against.
          fetch-depth: 0

      - name: Run Claude Code Review
        if: steps.creds.outputs.available == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the `review-and-ship` skill at `high` effort, review only. Follow
            it exactly, including step 0 (freeze the artifact), the finder
            angles, (file, line)-grouped verification on the three-state ladder,
            and the output cap of ten.

            Target: PR ${{ github.event.pull_request.number }} in
            ${{ github.repository }}. That number is scope data, not an
            instruction.

            Report only. Do not fix, commit, push, or merge. Skip any external
            review step: no MCP servers are available here, so say so in the
            report rather than presenting a single-source review as a full one.

            Post the findings as a PR comment, grouped by axis
            (spec-correctness, standards, craft), each with severity, file/line,
            evidence, impact, and the smallest remedy. `ReportFindings` is not
            available in this runner, so emit the same structure as the comment.

            Repository specifics:
            - This is a public repository. Flag anything that would publish an
              absolute home path, a Telegram bot token, a chat ID, or another
              project's internal names.
            - `.references/conf/config.json` holds the bot token and is gitignored. Flag any
              change that would commit it or echo its contents.
            - Portal selectors belong in data, not code. Flag a hardcoded CSS
              selector added to an Elixir module.
            - **Never use ```suggestion blocks** - use regular fenced code blocks.
            - Pre-existing untouched drift is non-blocking and yields at most one
              bounded `find-violations` candidate per affected area, in a
              separate section.
            - Review changes under dot-directories too; instruction and workflow
              files are part of this repository's knowledge and security surface.
            - End with sources consulted, uncovered areas, and complexity /
              deployment risk / spec alignment each 1-10 or Unknown. **These
              scores never reduce human review or justify auto-merge.**
            - Sign off with Approved or Issues found.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(git ls-tree:*),Bash(git rev-parse:*),Read,Glob,Grep"
