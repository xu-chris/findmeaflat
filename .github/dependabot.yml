version: 2
updates:
  # Docker ecosystem updates removed alongside npm: the Dockerfile moved to
  # .references/ with the Node crawler. Re-add pointing at the Elixir app's
  # Dockerfile once it exists.

  # npm ecosystem updates removed. The Node crawler moved to .references/ as
  # read-only history; bumping its dependencies has no purpose and would open
  # PRs nobody should merge. Add a 'hex' ecosystem entry once mix.exs exists.

  # GitHub Actions ecosystem updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 5
    reviewers:
      - '@xu-chris'
    assignees:
      - '@xu-chris'
    commit-message:
      # Use 'ci' for CI configuration files and scripts
      prefix: 'ci'
      prefix-development: 'ci'
      include: 'scope'
