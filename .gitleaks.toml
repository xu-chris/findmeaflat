# Gitleaks configuration for FindMeAFlat.
#
# Extends the upstream default ruleset rather than replacing it: a hand-written
# rule list silently loses coverage every time gitleaks adds a provider.
[extend]
useDefault = true

[allowlist]
description = "Documented non-secrets"

paths = [
  # Phoenix generates a literal secret_key_base into config/dev.exs and
  # config/test.exs. They are high-entropy, so gitleaks flags them, but they
  # protect nothing: they sign dev and test sessions only, and production reads
  # SECRET_KEY_BASE from the environment and raises when it is missing
  # (config/runtime.exs). Scoped to these two files by name rather than to
  # config/ as a whole, so a real secret landing in runtime.exs or prod.exs
  # still fails the scan.
  '''config/dev\.exs''',
  '''config/test\.exs''',
  # Example config: placeholder values only ("yourToken", "yourChatId").
  '''conf/config\.json\.example''',
  # Proposal documents quote public open-data endpoints and package checksums.
  '''docs/proposals/.*\.md''',
  # Pinned release checksums, not credentials.
  '''\.github/scripts/gitleaks\.sh''',
]

regexTarget = "match"
regexes = [
  # Kleinanzeigen ships a search-only data-algolia-api-key to every visitor's
  # browser. It is public by design and none of ours, and portal fixtures are
  # committed byte-for-byte because that is their whole value.
  #
  # Matched by its own key name rather than by allowlisting the fixture directory:
  # a path-level allowlist would suppress EVERY rule for those files, so a fixture
  # later captured from an authenticated session could carry a real token straight
  # into public history with both the history scan and the pre-publish gate silent.
  '''data-algolia-api-key="[a-f0-9]{32}"''',
  # Placeholders from README/config examples.
  '''yourToken''',
  '''yourChatId''',
  '''yourApiKey''',
]
